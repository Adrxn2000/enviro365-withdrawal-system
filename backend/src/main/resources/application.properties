# --- Server ---
server.port=8080

# --- H2 in-memory database ---
# jdbc:h2:mem:enviro365 means the DB lives only in RAM for the life of the
# process - required by the brief, and convenient because there's nothing
# to install: it starts fresh every run.
spring.datasource.url=jdbc:h2:mem:enviro365
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Exposes a web UI at /h2-console to inspect the tables/data live while
# the app is running - handy for demoing to an interviewer.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ddl-auto=create-drop: Hibernate reads the @Entity classes and generates
# the CREATE TABLE statements itself at startup, then drops them at
# shutdown. No manual schema.sql needed for an assessment like this.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# defer-datasource-initialization=true makes Spring Boot run data.sql
# AFTER Hibernate has created the tables from the entities above - if this
# were false (the default), data.sql would run first and fail because the
# tables wouldn't exist yet.
spring.jpa.defer-datasource-initialization=true
